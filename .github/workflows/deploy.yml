# Build the arm64 image (OKE node pool is VM.Standard.A1.Flex), push it to OCIR and bump the tag in
# deploy/k8s so Argo CD rolls it out. Same flow as msp-homepage.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/k8s/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write # tag bump commit

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: yny.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: yny.ocir.io/axbeonwnkylm/chuncheon-prod/daon-news:${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bump image tag (GitOps)
        run: |
          sed -i -E "s|(image: yny.ocir.io/axbeonwnkylm/chuncheon-prod/daon-news):.*|\1:${{ steps.v.outputs.sha }}|" deploy/k8s/*.yaml
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "deploy: ${{ steps.v.outputs.sha }}" || echo "no change"
          git push
